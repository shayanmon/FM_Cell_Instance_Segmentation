# Conda environment for Linux/HPC. Mirrors requirements.txt (the versions used for the
# local Windows run). PyTorch comes from the CUDA 12.6 wheel index, which still
# supports V100 (sm_70) as well as A100/H100/Ada.
#   conda env create -f environment.yml && conda activate uni_seg
name: uni_seg
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pip
  - pip:
    - --extra-index-url https://download.pytorch.org/whl/cu126
    - torch==2.14.1
    - torchvision==0.29.1
    - -r requirements.txt
